[package]
name = "pulp-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
pulp-core = { path = "../pulp-core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
] }
clap = { version = "4", features = ["derive"] }

# i18n：编译期打包翻译文件 + 运行时切换语言（默认为系统语言，支持设置/回滚）
rust-i18n = "3"

# 系统语言检测：读取当前 OS 环境/区域设置（跨平台）
sys-locale = "0.3"

# 配置持久化（为后续“统一 locale 处理策略/回滚逻辑”预留）：
# - directories-next：获取跨平台配置目录（Linux/macOS/Windows）
# - serde + toml：以 TOML 作为人类可读的配置格式
directories-next = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
