[workspace]
members = [
    "crates/pulp",
    "apps/pulp-cli",
    "apps/pulp-ui",
]
default-members = ["apps/pulp-cli", "apps/pulp-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[profile.dev]
incremental = true # Compile binaries in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time optimization.
opt-level = "s"   # Prioritizes small binary size; use 3 for maximum speed.
panic = "abort"   # Disables panic handlers for a smaller release binary.
strip = true      # Removes debug symbols from release artifacts.

[workspace.dependencies]
cc = "1.4"
clap = { version = "4.6", features = ["derive"] }
dark-light = "3.0"
filetime = "0.2"
gpui = "0.2.2"
gpui-component = { version = "0.5.1", default-features = false }
infer = { version = "0.22", default-features = false }
lucide-icons = { version = "1.34", default-features = false }
pulp = { path = "crates/pulp", version = "0.1.0" }
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "1"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = "warn"
