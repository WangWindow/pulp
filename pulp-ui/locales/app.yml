_version: 2

# -----------------------------------------------------------------------------
# Pulp UI i18n resources
#
# 说明：
# - 使用 rust-i18n 的 _version:2 格式：一个 key 下按 locale 分支。
# - 约定：英文为默认回退语言（fallback=en），system locale 若匹配不到则回退 en。
# - key 命名：按模块分组（app/menu/drawer/task/files/sidebar/dialog/errors/...），便于维护。
# - 日后扩展：新增 key 时请保持英文短句、避免拼接；尽量用变量占位 %{name}。
# -----------------------------------------------------------------------------

